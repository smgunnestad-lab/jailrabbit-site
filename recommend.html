<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recommended - JailRabbit</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Magien som fikser flimringen og lager en myk overgang: */
    .flicker-fix-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); /* Gjør alt mørkt */
      display: flex; justify-content: center; align-items: center;
      z-index: 2000;
      opacity: 0; visibility: hidden; /* Skjult som standard */
      transition: opacity 0.3s ease; /* Gjør at den fader mykt inn */
      pointer-events: none; /* Nettsiden ignorerer at denne ligger over musen! */
    }
    
    .flicker-fix-overlay.active {
      opacity: 1; visibility: visible;
    }
    
    .flicker-fix-overlay video {
      width: 80%; max-width: 600px;
      border-radius: 8px; border: 4px solid white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo">🐇 JailRabbit</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="trips.html">Trips</a>
      <a href="events.html">Events</a>
      <a href="whiteboard.html">Whiteboard</a>
      <a href="recommend.html" style="color: #7c7cff;">Recommended</a>
    </nav>
  </header>

  <div class="flicker-fix-overlay" id="overlay">
    <video id="popupVideo" muted autoplay loop>
      <source id="videoSource" src="" type="video/mp4">
    </video>
  </div>

  <main>
    <h1>Community Streamers</h1>
    <p>Our top recommended content creators.</p>

    <div class="yearbook-grid">

      <div class="yearbook-card" data-video="videos/lapsclip.mp4">
        <img src="https://media1.tenor.com/m/XPT5nUEaYzcAAAAC/standing-kitty.gif" alt="Streamer 1">
        <div class="card-text">
          <h3>Laps</h3>
          <p>Class of 2026</p>
        </div>
      </div>

      <div class="yearbook-card" data-video="videos/annen_video.mp4">
        <img src="https://via.placeholder.com/300" alt="Streamer 2">
        <div class="card-text">
          <h3>Beeva</h3>
          <p>Legendary Builder</p>
        </div>
      </div>

    </div>
  </main>

  <script>
    // 1. Henter ALLE kortene i grid-en (så du kan ha uendelig mange streamere)
    const cards = document.querySelectorAll('.yearbook-card');
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('popupVideo');
    const source = document.getElementById('videoSource');

    // 2. Går gjennom hvert enkelt kort og legger til hover-logikken
    cards.forEach(card => {
      
      card.addEventListener('mouseenter', () => {
        const vSrc = card.getAttribute('data-video');
        source.src = vSrc; // Henter videostien fra 'data-video' i HTML
        video.load(); // Tvinger nettleseren til å laste inn filen
        overlay.classList.add('active'); // Fader inn mørk skjerm + video
        video.play(); // Starter filmen
      });

      card.addEventListener('mouseleave', () => {
        overlay.classList.remove('active'); // Skjuler skjermen igjen
        video.pause(); // Setter på pause
      });

    });
  </script>
</body>
</html>

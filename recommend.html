<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recommended - JailRabbit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="overlay" id="overlay">
    <div class="overlay-content">
      <video id="popupVideo" controls>
        <source src="video1.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <header class="navbar">
    <div class="logo">🐇 JailRabbit</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="trips.html">Trips</a>
      <a href="events.html">Events</a>
      <a href="whiteboard.html">Whiteboard</a>
      <a href="recommend.html" style="color: #7c7cff;">Recommended</a>
    </nav>
  </header>

  <main>
    <h1>Community Streamers</h1>
    <p>Our top recommended content creators this month.</p>

    <div class="yearbook-card" data-video="videos/lapsclip.mp4">
  <img src="https://via.placeholder.com/300" alt="Streamer">
  <div class="card-text">
    <h3>STREAMER NAME</h3>
    <p>Class of 2026</p>
  </div>
</div>

<script>
  const card = document.querySelector('.yearbook-card');
  const overlay = document.getElementById('overlay');
  const video = document.getElementById('popupVideo');
  const source = document.getElementById('videoSource');

  card.addEventListener('mouseenter', () => {
    const vSrc = card.getAttribute('data-video');
    source.src = vSrc;
    video.load();
    overlay.classList.add('active');
    video.play();
  });

  // Vi legger til en "mouseleave" på selve overlayet i stedet, 
  // slik at videoen holder seg åpen så lenge du er over kortet ELLER overlayet
  overlay.addEventListener('mouseleave', () => {
    overlay.classList.remove('active');
    video.pause();
  });
</script>
  </main>

</body>
</html>

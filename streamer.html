<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Streamer Yearbook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="overlay" id="overlay" onclick="this.classList.remove('active'); this.querySelector('video').pause();">
    <video id="popupVideo" controls></video>
  </div>

  <header class="navbar">
    <div class="logo">🐇 JailRabbit</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="trips.html">Trips</a>
      <a href="events.html">Events</a>
      <a href="whiteboard.html">Whiteboard</a>
      <a href="streamers.html">Streamers</a>
    </nav>
  </header>

  <main>
    <h1>Streamer Yearbook</h1>
    <p>The legends that built JailRabbit.</p>

    <div class="yearbook-grid">
      <div class="yearbook-card" onmouseover="showVideo('video1.mp4')" onmouseout="hideVideo()">
        <img src="https://via.placeholder.com/200" alt="Streamer">
        <p>STREAMER NAME</p>
      </div>
    </div>
  </main>

  <script>
    function showVideo(videoSrc) {
      const overlay = document.getElementById('overlay');
      const video = document.getElementById('popupVideo');
      video.src = videoSrc;
      overlay.classList.add('active');
      video.play();
    }
    function hideVideo() {
      const overlay = document.getElementById('overlay');
      const video = document.getElementById('popupVideo');
      overlay.classList.remove('active');
      video.pause();
    }
  </script>
</body>
</html>

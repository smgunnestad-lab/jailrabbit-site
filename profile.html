<script type="module">
  import { checkAuthState, logout, login } from './auth.js';

  const container = document.getElementById('profile-content');
  const logoutBtn = document.getElementById('logoutBtn');

  checkAuthState((user) => {
    if (user) {
      // Bruker er logget inn
      container.innerHTML = `
        <img src="${user.photoURL}" width="100" style="border-radius:50%">
        <h2>${user.displayName}</h2>
        <p>E-post: ${user.email}</p>
      `;
      logoutBtn.style.display = 'block';
    } else {
      // Bruker er IKKE logget inn - vis innloggingsknapp
      container.innerHTML = `<p>Du må logge inn for å se profilen din.</p>`;
      const loginBtn = document.createElement('button');
      loginBtn.innerText = "Logg inn med Google";
      loginBtn.onclick = () => login().then(() => window.location.reload());
      container.appendChild(loginBtn);
      logoutBtn.style.display = 'none';
    }
  });

  logoutBtn.addEventListener('click', () => {
    logout().then(() => window.location.href = 'index.html');
  });
</script>

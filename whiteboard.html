<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Whiteboard - JailRabbit</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Spesifikk stil for whiteboardet */
    .whiteboard-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2rem;
    }
    
    .tools {
      margin-bottom: 1rem;
      display: flex;
      gap: 1rem;
      background: #11152a;
      padding: 10px 20px;
      border-radius: 8px;
    }

    canvas {
      background: white;
      border-radius: 8px;
      cursor: crosshair;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">🐇 JailRabbit</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="trips.html">Trips</a>
      <a href="events.html">Events</a>
      <a href="whiteboard.html">Whiteboard</a>
    </nav>
  </header>

  <main>
    <h1>🖌️ Solo Whiteboard</h1>
    <p>Test version, only local on your machine for now.</p>
    
    <div class="whiteboard-container">
      <div class="tools">
        <label for="colorPicker">Farge:</label>
        <input type="color" id="colorPicker" value="#000000">
        
        <label for="brushSize">Størrelse:</label>
        <input type="range" id="brushSize" min="1" max="20" value="5">
        
        <button class="btn" id="clearBtn" style="margin: 0; padding: 5px 15px;">Tøm brett</button>
      </div>
      
      <!-- Selve tegnebrettet -->
      <canvas id="board" width="800" height="500"></canvas>
    </div>
  </main>

  <!-- JavaScript for å få tegnebrettet til å fungere -->
  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    
    let isDrawing = false;
    
    // Hent verktøy
    const colorPicker = document.getElementById('colorPicker');
    const brushSize = document.getElementById('brushSize');
    const clearBtn = document.getElementById('clearBtn');

    // Start tegning
    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });

    // Tegn mens musen beveger seg
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = brushSize.value;
      ctx.lineCap = 'round';
      ctx.stroke();
    });

    // Stopp tegning
    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
    });
    
    // Tøm brettet
    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });
  </script>
</body>
</html>

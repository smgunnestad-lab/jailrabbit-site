<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In - JailRabbit</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Henter inn ikoner fra FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /*====== SIGN IN BOX STYLING ======*/
    .profile-box {
      background: #000; /* Svart bakgrunn */
      border: 1px solid #333;
      padding: 40px;
      border-radius: 8px;
      color: #fff;
      max-width: 380px;
      width: 100%;
      margin: 50px auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      box-sizing: border-box;
    }
    .profile-box h2 {
      color: #fff; margin-top: 0; margin-bottom: 25px; font-weight: 600; font-size: 1.8rem;
    }
    
    /* Input felter */
    .input-group { margin-bottom: 15px; }
    .input-group input {
      width: 100%; padding: 14px; background: #111; border: 1px solid #444; 
      color: #fff; border-radius: 4px; font-family: inherit; font-size: 0.95rem; box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .input-group input:focus { outline: none; border-color: #fff; }
    
    /* Sign In Knapp */
    .btn-submit {
      width: 100%; padding: 14px; background: #fff; color: #000; 
      font-weight: 800; border: none; border-radius: 4px; cursor: pointer; 
      transition: background 0.2s; font-size: 1rem; margin-top: 10px;
    }
    .btn-submit:hover { background: #ccc; }
    
    /* Register & Forgot Password linker */
    .auth-links {
      display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.85rem;
    }
    .auth-links a { color: #888; text-decoration: none; cursor: pointer; transition: color 0.2s; }
    .auth-links a:hover { color: #fff; }

    /* Divider (Connect account) */
    .divider {
      display: flex; align-items: center; text-align: center; margin: 30px 0; 
      color: #666; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #333; }
    .divider::before { margin-right: 15px; }
    .divider::after { margin-left: 15px; }

    /* Sosiale ikoner */
    .social-icons { display: flex; justify-content: center; gap: 15px; }
    .social-icon {
      width: 45px; height: 45px; background: #111; border: 1px solid #444; 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      cursor: pointer; transition: all 0.2s; color: #fff; font-size: 1.2rem; text-decoration: none;
    }
    .social-icon:hover { background: #fff; color: #000; transform: translateY(-2px); }
  </style>
</head>
<body>
  
  <header class="navbar">
    <div class="logo">🐇 JailRabbit</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="trips.html">Trips</a>
      <a href="events.html">Events</a>
      <a href="whiteboard.html">Whiteboard</a>
      <a href="recommend.html">Recommended</a>
      <a href="profile.html" id="nav-login-link" style="color: #7c7cff;">Log in</a>
    </nav>
  </header>

  <main>
    <div class="profile-box" id="profile-content">
      <p>Loading...</p>
    </div>
  </main>

  <script type="module">
    import { checkAuthState, logout, loginWithGoogle, loginWithEmail, registerWithEmail } from './auth.js';

    const container = document.getElementById('profile-content');

    checkAuthState((user) => {
      if (user) {
        //====== LOGGET INN ======//
        // Hvis brukeren registrerte seg med e-post, har de kanskje ikke et profilbilde ennå
        const photo = user.photoURL || "https://via.placeholder.com/100/333333/ffffff?text=User";
        const name = user.displayName || "Rabbit Member";

        container.innerHTML = `
          <img src="${photo}" width="100" style="border-radius:50%; border:3px solid #fff; margin-bottom:15px;">
          <h2>${name}</h2>
          <p style="color: #888; margin-bottom: 25px;">${user.email}</p>
          <button id="logoutBtn" class="btn-submit" style="background: #333; color: #fff;">Log out</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          logout().then(() => window.location.reload());
        });
      } else {
        //====== IKKE LOGGET INN (SIGN IN SKJEMA) ======//
        container.innerHTML = `
          <h2>Sign In</h2>
          <div class="input-group">
            <input type="email" id="emailInput" placeholder="Email" />
          </div>
          <div class="input-group">
            <input type="password" id="passwordInput" placeholder="Password" />
          </div>
          <button class="btn-submit" id="signInBtn">Sign In</button>
          
          <div class="auth-links">
            <a id="registerBtn">Register</a>
            <a id="forgotBtn">Forgot password?</a>
          </div>

          <div class="divider">Connect account</div>

          <div class="social-icons">
            <div class="social-icon" id="googleLogin" title="Google"><i class="fab fa-google"></i></div>
            <div class="social-icon" title="Discord"><i class="fab fa-discord"></i></div>
            <div class="social-icon" title="Twitch"><i class="fab fa-twitch"></i></div>
            <div class="social-icon" title="Kick"><b>K</b></div>
          </div>
        `;

        // Innlogging med E-post
        document.getElementById('signInBtn').addEventListener('click', () => {
          const email = document.getElementById('emailInput').value;
          const pass = document.getElementById('passwordInput').value;
          loginWithEmail(email, pass)
            .then(() => window.location.reload())
            .catch(err => alert("Error logging in: " + err.message));
        });

        // Registrering med E-post
        document.getElementById('registerBtn').addEventListener('click', () => {
          const email = document.getElementById('emailInput').value;
          const pass = document.getElementById('passwordInput').value;
          if(pass.length < 6) return alert("Password must be at least 6 characters.");
          registerWithEmail(email, pass)
            .then(() => window.location.reload())
            .catch(err => alert("Error registering: " + err.message));
        });

        // "Forgot password" visual only atm
        document.getElementById('forgotBtn').addEventListener('click', () => {
          alert("Forgot password functionality coming soon!");
        });

        // Innlogging med Google (Ikonet)
        document.getElementById('googleLogin').addEventListener('click', () => {
          loginWithGoogle().then(() => window.location.reload()).catch(err => console.error(err));
        });
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Streamer Yearbook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LIGHTBOX / POPUP -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <video id="popupVideo" controls>
        <source src="" type="video/mp4">
      </video>
    </div>
  </div>

  <header class="navbar">
    <div class="logo">🐇 JailRabbit</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="trips.html">Trips</a>
      <a href="events.html">Events</a>
      <a href="whiteboard.html">Whiteboard</a>
      <a href="streamers.html">Streamers</a>
    </nav>
  </header>

  <main>
    <h1>Streamer Yearbook</h1>
    <p>The legends that built JailRabbit.</p>

    <div class="yearbook-grid">
      <!-- EKSEMPEL PÅ ETT KORT -->
      <div class="yearbook-card" onmouseover="openLightbox('video1.mp4')" onmouseout="closeLightbox()">
        <img src="https://via.placeholder.com/300" alt="Streamer Name">
        <div class="card-text">
          <h3>STREAMER NAME</h3>
          <p>Class of 2026</p>
        </div>
      </div>
      <!-- Legg til flere yearbook-card her -->
    </div>
  </main>

  <script>
    function openLightbox(videoSrc) {
      const lightbox = document.getElementById('lightbox');
      const video = document.getElementById('popupVideo');
      video.src = videoSrc;
      lightbox.style.display = 'flex';
      video.play();
    }
    
    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      const video = document.getElementById('popupVideo');
      lightbox.style.display = 'none';
      video.pause();
    }
  </script>
</body>
</html>

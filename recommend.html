    <div class="yearbook-card" 
     onmouseover="openVideo('videos/lapsclip.mp4')" 
     onmouseout="closeVideo()">
  <img src="https://via.placeholder.com/300" alt="Streamer">
  <div class="card-text">
    <h3>STREAMER NAME</h3>
    <p>Class of 2026</p>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-content">
    <video id="popupVideo" width="100%" controls>
      <source id="videoSource" src="" type="video/mp4">
      Din nettleser støtter ikke video.
    </video>
  </div>
</div>

<script>
  function openVideo(src) {
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('popupVideo');
    const source = document.getElementById('videoSource');
    
    source.src = src;
    video.load(); // Tvinger nettleseren til å laste den nye filen
    overlay.classList.add('active');
    video.play();
  }

  function closeVideo() {
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('popupVideo');
    overlay.classList.remove('active');
    video.pause();
  }
</script>
  </main>

</body>

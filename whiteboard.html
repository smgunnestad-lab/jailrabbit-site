<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Whiteboard - JailRabbit</title>
  <style>
    /* 1. GRUNNOPPSETT */
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; /* hides scroll */
      background-color: #1a1d2e; /* Mørk bakgrunn utenfor arket */
      font-family: system-ui, sans-serif;
    }

    /* 2. ARBEIDSOMRÅDET (Workspace) */
    #workspace {
      width: 100vw; height: 100vh;
      position: relative;
      cursor: crosshair;
    }

    /* Dette er selve "Arket" som flyttes og zoomes */
    #canvas-wrapper {
      position: absolute;
      width: 3000px; height: 2000px;
      background-color: #ffffff; /* Arket er hvitt */
      /* CSS-rutenettet tegnes på arket, under tegningen */
      background-image: 
        linear-gradient(rgba(200, 200, 200, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200, 200, 200, 0.4) 1px, transparent 1px);
      background-size: 30px 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform-origin: 0 0; /* Viktig for zoom-matematikken */
    }

    canvas {
      width: 100%; height: 100%;
      display: block;
    }

    /* 3. TOPP-MENYEN */
    .navbar-hover-zone {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 100;
    }
    .navbar {
      position: absolute; top: -100px; left: 0; width: 100%;
      background: #11152a; color: white; display: flex;
      justify-content: center; align-items: center;
      padding: 15px 2rem; box-sizing: border-box;
      transition: top 0.3s ease-in-out;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      gap: 3rem;
    }
    .navbar-hover-zone:hover .navbar, .navbar:hover, .navbar:focus-within { top: 0; }
    
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { color: #7c7cff; text-decoration: none; font-weight: 600; }
    .nav-links a:hover { color: white; }

    .btn {
      background: #7c7cff; color: white; border: none;
      padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .btn:hover { background: #5b5bcc; }
    .btn-download { background: #28a745; }
    .btn-download:hover { background: #218838; }

    /* 4. VENSTRE SIDEBAR (Farger og verktøy) */
    .sidebar {
      position: fixed; top: 20%; left: 0;
      background: #11152a; padding: 20px;
      border-radius: 0 15px 15px 0;
      box-shadow: 5px 5px 20px rgba(0,0,0,0.3);
      display: flex; flex-direction: column; align-items: center; gap: 15px;
      z-index: 90;
      transition: transform 0.3s ease-in-out;
    }

    /* Sklir menyen delvis ut til venstre */
    .sidebar.drawing {
      transform: translateX(-70%);
      opacity: 0.6;
    }

    .color-section { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    
    /* Muse-velger knapper (M1 / M2) */
    .mouse-toggles { display: flex; gap: 5px; }
    .mouse-btn {
      background: #2a2d3e; color: gray; border: 2px solid transparent;
      padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem;
    }
    .mouse-btn.active { border-color: #7c7cff; color: white; background: #1a1d2e; }

    /* HEX Input */
    .hex-input {
      background: #2a2d3e; color: white; border: 1px solid #444;
      border-radius: 4px; padding: 5px; width: 70px; text-align: center;
      font-family: monospace;
    }

    /* Rund fargevelger */
    .color-circle-wrapper {
      width: 50px; height: 50px; border-radius: 50%;
      overflow: hidden; border: 3px solid #7c7cff;
      cursor: pointer;
    }
    .color-circle-wrapper input[type="color"] {
      width: 200%; height: 200%; transform: translate(-25%, -25%); cursor: pointer; border: none;
    }

    /* Andre verktøy i sidebar */
    .sidebar label { color: white; font-size: 0.8rem; margin-bottom: -10px; }
    .sidebar select, .sidebar input[type="range"] {
      background: #2a2d3e; color: white; border: 1px solid #444;
      border-radius: 4px; padding: 5px; width: 100px;
    }
  </style>
</head>
<script type="module">
  import { checkAuthState } from './auth.js';
  checkAuthState((user) => {
    const navLink = document.getElementById('nav-login-link');
    if (navLink) {
      navLink.innerText = user ? "My Profile" : "Log in";
    }
  });
</script>
<body>

  <!-- Toppmenyen -->
  <div class="navbar-hover-zone">
    <header class="navbar">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="trips.html">Trips</a>
        <a href="events.html">Events</a>
        <a href="whiteboard.html" style="color: white; border-bottom: 2px solid white;">Whiteboard</a>
        <a href="recommend.html">Recommended</a>
        <a href="profile.html" id="nav-login-link">Log in</a>
      </div>
      
      <div style="display: flex; gap: 10px;">
        <button class="btn" id="undoBtn">Undo (Ctrl+Z)</button>
        <button class="btn" id="clearBtn" style="background:#ff4c4c;">Clear</button>
        <button class="btn btn-download" id="downloadBtn">⬇ Download Board</button>
      </div>
    </header>
  </div>

  <!-- Venstre Sidebar -->
  <div class="sidebar" id="sidebar">
    
    <div class="mouse-toggles">
      <button class="mouse-btn active" id="btnM1">M1</button>
      <button class="mouse-btn" id="btnM2">M2</button>
    </div>

    <div class="color-section">
      <input type="text" class="hex-input" id="hexInput" value="#000000">
      <div class="color-circle-wrapper">
        <input type="color" id="colorPicker" value="#000000">
      </div>
    </div>

    <label>Tool:</label>
    <select id="tool">
      <option value="pen">Pen</option>
      <option value="line">Line</option>
      <option value="rect">Rectangle</option>
      <option value="circle">Circle</option>
      <option value="eraser">Eraser</option>
    </select>

    <label>Size:</label>
    <input type="range" id="brushSize" min="1" max="50" value="5">
  </div>

  <!-- Arbeidsområdet med arket -->
  <div id="workspace">
    <div id="canvas-wrapper">
      <canvas id="board" width="3000" height="2000"></canvas>
    </div>
  </div>

  <script>
    const workspace = document.getElementById('workspace');
    const wrapper = document.getElementById('canvas-wrapper');
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const sidebar = document.getElementById('sidebar');

    // Farger og verktøy
    let colors = { M1: '#000000', M2: '#7c7cff' };
    let activeMouse = 'M1'; // Hvilken knapp vi redigerer fargen til
    
    const hexInput = document.getElementById('hexInput');
    const colorPicker = document.getElementById('colorPicker');
    const btnM1 = document.getElementById('btnM1');
    const btnM2 = document.getElementById('btnM2');
    const toolSelect = document.getElementById('tool');
    const brushSize = document.getElementById('brushSize');

    // Kamera / Panning / Zoom variabler
    let scale = 1;
    // Sentrerer det 3000x2000 arket
    let panX = (window.innerWidth - 3000) / 2;
    let panY = (window.innerHeight - 2000) / 2;
    
    // Tegnevariabler
    let isDrawing = false;
    let startX, startY;
    let historyArray = [];
    let historyStep = -1;

    // --- OPPSTART ---
    function updateTransform() {
      wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }
    updateTransform();
    saveState(); // Lagre tomt ark i historikken

    // Hindrer standard høyreklikk-meny
    window.addEventListener('contextmenu', e => e.preventDefault());

    // --- FARGEVELGER LOGIKK ---
    function updateColorUI() {
      hexInput.value = colors[activeMouse];
      colorPicker.value = colors[activeMouse];
      btnM1.classList.toggle('active', activeMouse === 'M1');
      btnM2.classList.toggle('active', activeMouse === 'M2');
    }

    btnM1.addEventListener('click', () => { activeMouse = 'M1'; updateColorUI(); });
    btnM2.addEventListener('click', () => { activeMouse = 'M2'; updateColorUI(); });

    colorPicker.addEventListener('input', (e) => {
      colors[activeMouse] = e.target.value;
      hexInput.value = e.target.value;
    });

    hexInput.addEventListener('input', (e) => {
      if(/^#[0-9A-F]{6}$/i.test(e.target.value)) {
        colors[activeMouse] = e.target.value;
        colorPicker.value = e.target.value;
      }
    });

    // --- ZOOM & PAN (Scroll og M1+M2) ---
    workspace.addEventListener('wheel', (e) => {
      e.preventDefault(); // Stopp scrolling av nettsiden
      const zoomSensitivity = 0.001;
      const delta = -e.deltaY * zoomSensitivity;
      const newScale = Math.min(Math.max(0.2, scale + delta), 5); // Max zoom inn/ut
      
      // Regn ut musens posisjon i forhold til containeren for å zoome PÅ musen
      const mouseX = e.clientX - panX;
      const mouseY = e.clientY - panY;

      panX -= mouseX * (newScale / scale - 1);
      panY -= mouseY * (newScale / scale - 1);
      scale = newScale;
      updateTransform();
    }, { passive: false });

    // Hjelpefunksjon: Konverterer mus-piksler til lerret-piksler, uansett zoom
    function getMousePos(e) {
      return {
        x: (e.clientX - panX) / scale,
        y: (e.clientY - panY) / scale
      };
    }

    // --- TEGNE & DRA-LOGIKK ---
    workspace.addEventListener('mousedown', (e) => {
      // 3 = Både M1+M2 holdes inne, 4 = Musehjulet trykkes inn. (Dra-modus)
      if (e.buttons === 3 || e.buttons === 4) return; 
      
      const pos = getMousePos(e);
      if(pos.x < 0 || pos.y < 0 || pos.x > canvas.width || pos.y > canvas.height) return; // Utenfor arket

      isDrawing = true;
      sidebar.classList.add('drawing'); // Skyv menyen til venstre
      startX = pos.x;
      startY = pos.y;

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      
      const tool = toolSelect.value;
      const drawColor = (e.button === 2) ? colors.M2 : colors.M1;
      
      // Eraser: Fjerner fargen, men beholder CSS-rutenettet bak
      if (tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = brushSize.value * 2; // Litt større viskelær
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = drawColor;
        ctx.lineWidth = brushSize.value;
      }
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    });

    workspace.addEventListener('mousemove', (e) => {
      // PANORERING (Dra seg rundt)
      if (e.buttons === 3 || e.buttons === 4) {
        panX += e.movementX;
        panY += e.movementY;
        updateTransform();
        workspace.style.cursor = 'grab';
        return;
      } else {
        workspace.style.cursor = 'crosshair';
      }

      // TEGNING
      if (!isDrawing) return;
      const pos = getMousePos(e);
      const tool = toolSelect.value;

      if (tool === 'pen' || tool === 'eraser') {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else {
        // For figurer: Last inn forrige lagrede steg først(preview)
        restoreState(historyStep);
        ctx.beginPath();
        if (tool === 'line') {
          ctx.moveTo(startX, startY);
          ctx.lineTo(pos.x, pos.y);
        } else if (tool === 'rect') {
          ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
        } else if (tool === 'circle') {
          const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
          ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
        }
        ctx.stroke();
      }
    });

    const stopDrawing = () => {
      if (isDrawing) {
        isDrawing = false;
        sidebar.classList.remove('drawing'); // Ta menyen tilbake
        ctx.closePath();
        saveState();
      }
    };
    workspace.addEventListener('mouseup', stopDrawing);
    workspace.addEventListener('mouseleave', stopDrawing);

    // --- UNDO (Historikk) ---
    function saveState() {
      if (historyStep < historyArray.length - 1) {
        historyArray = historyArray.slice(0, historyStep + 1);
      }
      historyArray.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      historyStep++;
    }

    function restoreState(index) {
      if (index >= 0 && index < historyArray.length) {
        ctx.putImageData(historyArray[index], 0, 0);
      }
    }

    document.getElementById('undoBtn').addEventListener('click', () => {
      if (historyStep > 0) { historyStep--; restoreState(historyStep); }
    });
    
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'z') {
        if (historyStep > 0) { historyStep--; restoreState(historyStep); }
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      saveState();
    });

    // --- DOWNLOAD BOARD (Uten rutenett!) ---
    document.getElementById('downloadBtn').addEventListener('click', () => {
      // 1. Lag et usynlig reserve-ark
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tCtx = tempCanvas.getContext('2d');
      
      // 2. Fyll reserve-arket med kritthvitt (uten ruter)
      tCtx.fillStyle = '#ffffff';
      tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      
      // 3. Stemple tegningen din oppå det hvite arket
      tCtx.drawImage(canvas, 0, 0);
      
      // 4. Last ned
      const link = document.createElement('a');
      link.download = 'jailrabbit_masterpiece.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
